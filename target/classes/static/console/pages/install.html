<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技能安装 - SkillCenter</title>
    
    <link rel="stylesheet" href="/skillcenter/console/css/remixicon/remixicon.css">
    <link rel="stylesheet" href="/skillcenter/console/css/theme.css">
    <link rel="stylesheet" href="/skillcenter/console/css/nexus.css">
</head>
<body>
    <div class="nx-page">
        <aside class="nx-page__sidebar">
            <div class="nx-p-4 nx-mb-4">
                <h1 class="nx-text-lg nx-font-bold" style="display: flex; align-items: center; gap: 8px;">
                    <i class="ri-bolt-line"></i> SkillCenter
                </h1>
            </div>
            <ul class="nav-menu" id="nav-menu"></ul>
        </aside>
        
        <main class="nx-page__content">
            <header class="nx-page__header">
                <div class="nx-flex nx-items-center nx-gap-3">
                    <button class="nx-btn nx-btn--ghost nx-btn--icon" data-nx-sidebar-toggle>
                        <i class="ri-menu-line"></i>
                    </button>
                    <h2 class="nx-text-lg nx-font-semibold">技能发现与安装</h2>
                </div>
                <div class="nx-flex nx-items-center nx-gap-3">
                    <button class="nx-btn nx-btn--ghost nx-btn--icon" data-nx-theme-toggle>
                        <i class="ri-sun-line"></i>
                    </button>
                </div>
            </header>
            
            <div class="nx-page__main">
                <div class="nx-container">
                    <div class="nx-card nx-mb-6">
                        <div class="nx-card__header nx-flex nx-justify-between nx-items-center">
                            <h3 class="nx-card__title">技能市场</h3>
                            <div class="nx-flex nx-gap-3">
                                <input type="text" id="skillKeyword" class="nx-input" placeholder="搜索技能..." style="width: 200px;">
                                <select id="skillTypeFilter" class="nx-select" style="width: 150px;">
                                    <option value="">全部类型</option>
                                    <option value="api">API集成</option>
                                    <option value="data-processing">数据处理</option>
                                    <option value="text-processing">文本处理</option>
                                    <option value="automation">自动化</option>
                                </select>
                                <button id="btnSearchSkill" class="nx-btn nx-btn--primary">
                                    <i class="ri-search-line"></i> 搜索
                                </button>
                            </div>
                        </div>
                        <div class="nx-card__body">
                            <table class="nx-table nx-table--striped">
                                <thead>
                                    <tr>
                                        <th>技能ID</th>
                                        <th>技能名称</th>
                                        <th>类型</th>
                                        <th>能力标签</th>
                                        <th>适用场景</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="discoveryTableBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <div id="skillDetailModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>技能详情</h3>
                <button class="modal-close" onclick="closeSkillDetailModal()">&times;</button>
            </div>
            <div class="modal-body" id="skillDetailContent">
            </div>
            <div class="modal-footer">
                <button class="nx-btn nx-btn--ghost" onclick="closeSkillDetailModal()">关闭</button>
            </div>
        </div>
    </div>
    
    <script src="/skillcenter/console/js/theme-manager.js"></script>
    <script src="/skillcenter/console/js/nexus-menu.js"></script>
    <script src="/skillcenter/console/js/utils.js"></script>
    <script src="/skillcenter/console/js/install.js"></script>
    <script src="/skillcenter/console/js/page-init.js" data-auto-init></script>
</body>
</html>
