<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的群组 - SkillCenter</title>
    <link rel="stylesheet" href="/skillcenter/console/css/app.css">
    <link href="/skillcenter/console/css/remixicon/remixicon.css" rel="stylesheet">
    <script src="/skillcenter/console/js/utils.js"></script>
    <script src="/skillcenter/console/js/menu.js"></script>
    <script src="/skillcenter/console/js/tab-component.js"></script>
</head>
<body>
    <div class="container">
        <aside class="sidebar" id="sidebar">
            <!-- 菜单将通过menu.js动态加载 -->
        </aside>
        <main class="main-content">
            <header class="header">
                <h1>我的群组</h1>
                <div class="user-info">
                    <span class="user-name">用户</span>
                    <i class="ri-user-line"></i>
                </div>
            </header>
            <div class="group-content">
                <div class="group-actions">
                    <div class="group-search">
                        <input type="text" placeholder="搜索群组..." id="group-search-input">
                        <button class="btn-search">
                            <i class="ri-search-line"></i>
                        </button>
                    </div>
                </div>
                <div class="group-tabs">
                    <button class="tab-btn active" data-tab="list">群组列表</button>
                    <button class="tab-btn" data-tab="skills">群组技能</button>
                </div>
                <div class="tab-content" id="list-tab">
                    <div class="group-list" id="group-list">
                        <!-- 群组列表将通过JavaScript动态加载 -->
                    </div>
                </div>
                <div class="tab-content" id="skills-tab" style="display: none;">
                    <div class="group-skills" id="group-skills">
                        <!-- 群组技能将通过JavaScript动态加载 -->
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 群组成员管理模态框 -->
    <div class="modal" id="members-modal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2>群组成员管理</h2>
                <button class="close-btn" id="close-members-modal">
                    <i class="ri-close-line"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="members-list" id="members-list">
                    <!-- 成员列表将通过JavaScript动态加载 -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="close-members-btn">关闭</button>
            </div>
        </div>
    </div>

    <script src="/skillcenter/console/js/my-group.js"></script>
</body>
</html>
