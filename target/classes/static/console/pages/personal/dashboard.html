<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人仪表盘 - SkillCenter</title>
    <link rel="stylesheet" href="/skillcenter/console/css/app.css">
    <link href="/skillcenter/console/css/remixicon/remixicon.css" rel="stylesheet">
    <script src="/skillcenter/console/js/menu.js"></script>
    <script src="/skillcenter/console/js/utils.js"></script>
</head>
<body>
    <aside class="skillcenter-sidebar" id="sidebar">
        <!-- 菜单将通过menu.js动态加载 -->
    </aside>
    <main class="skillcenter-content-with-sidebar" id="main-content">
            <header class="header">
                <h1>个人仪表盘</h1>
                <div class="user-info">
                    <span class="user-name">用户</span>
                    <i class="ri-user-line"></i>
                </div>
            </header>
            <div class="dashboard-content">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon ri-lightbulb-line"></div>
                        <div class="stat-info">
                            <h3>我的技能</h3>
                            <p class="stat-value" id="skill-count">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon ri-play-circle-line"></div>
                        <div class="stat-info">
                            <h3>执行次数</h3>
                            <p class="stat-value" id="execution-count">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon ri-share-line"></div>
                        <div class="stat-info">
                            <h3>分享技能</h3>
                            <p class="stat-value" id="shared-count">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon ri-group-line"></div>
                        <div class="stat-info">
                            <h3>我的群组</h3>
                            <p class="stat-value" id="group-count">0</p>
                        </div>
                    </div>
                </div>
                <div class="recent-activities">
                    <h2>最近活动</h2>
                    <div class="activity-list" id="activity-list">
                        <div class="activity-item">
                            <div class="activity-icon ri-clock-line"></div>
                            <div class="activity-content">
                                <p>暂无活动记录</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="skill-progress">
                    <h2>技能执行统计</h2>
                    <canvas id="execution-chart" width="400" height="200"></canvas>
                </div>
            </div>
        </main>
    
    <script src="/skillcenter/console/js/personal-dashboard.js"></script>
</body>
</html>
