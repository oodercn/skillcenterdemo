<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技能市场 - SkillCenter</title>
    
    <link rel="stylesheet" href="/skillcenter/console/css/remixicon/remixicon.css">
    <link rel="stylesheet" href="/skillcenter/console/css/theme.css">
    <link rel="stylesheet" href="/skillcenter/console/css/nexus.css">
</head>
<body>
    <div class="nx-page">
        <aside class="nx-page__sidebar">
            <div class="nx-p-4 nx-mb-4">
                <h1 class="nx-text-lg nx-font-bold" style="display: flex; align-items: center; gap: 8px;">
                    <i class="ri-bolt-line"></i> SkillCenter
                </h1>
            </div>
            <ul class="nav-menu" id="nav-menu"></ul>
        </aside>
        
        <main class="nx-page__content">
            <header class="nx-page__header">
                <div class="nx-flex nx-items-center nx-gap-3">
                    <button class="nx-btn nx-btn--ghost nx-btn--icon" data-nx-sidebar-toggle>
                        <i class="ri-menu-line"></i>
                    </button>
                    <h2 class="nx-text-lg nx-font-semibold">技能市场</h2>
                </div>
                <div class="nx-flex nx-items-center nx-gap-3">
                    <button class="nx-btn nx-btn--ghost nx-btn--icon" data-nx-theme-toggle>
                        <i class="ri-sun-line"></i>
                    </button>
                </div>
            </header>
            
            <div class="nx-page__main">
                <div class="nx-container">
                    <div class="nx-card nx-mb-6">
                        <div class="nx-card__body">
                            <div class="nx-flex nx-items-center nx-gap-3">
                                <input type="text" id="search-keyword" placeholder="搜索技能..." class="nx-input" style="flex: 1;">
                                <button class="nx-btn nx-btn--primary" onclick="searchSkills()">
                                    <i class="ri-search-line"></i> 搜索
                                </button>
                                <button class="nx-btn nx-btn--secondary" onclick="resetSearch()">重置</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="nx-tabs nx-mb-6">
                        <button class="nx-tabs__tab nx-tabs__tab--active" data-tab="all">全部技能</button>
                        <button class="nx-tabs__tab" data-tab="popular">热门技能</button>
                        <button class="nx-tabs__tab" data-tab="latest">最新技能</button>
                        <button class="nx-tabs__tab" data-tab="api">API导入</button>
                    </div>
                    
                    <div id="skills-container">
                        <div class="nx-grid nx-grid-cols-3 nx-gap-6" id="skills-grid">
                            <div class="nx-card">
                                <div class="nx-card__body">
                                    <div class="nx-flex nx-items-center nx-gap-3 nx-mb-3">
                                        <i class="ri-cloud-sun-line nx-text-2xl nx-text-primary"></i>
                                        <div>
                                            <h4 class="nx-font-semibold">天气查询</h4>
                                            <span class="nx-badge nx-badge--primary">v1.0.0</span>
                                        </div>
                                    </div>
                                    <p class="nx-text-secondary nx-text-sm nx-mb-4">基于第三方API的天气查询技能，支持全球城市实时天气信息查询。</p>
                                    <div class="nx-flex nx-items-center nx-gap-2 nx-mb-4">
                                        <span class="nx-badge nx-badge--secondary">天气</span>
                                        <span class="nx-badge nx-badge--secondary">信息查询</span>
                                    </div>
                                    <div class="nx-flex nx-items-center nx-gap-2">
                                        <span class="nx-text-warning"><i class="ri-star-fill"></i> 4.8</span>
                                        <span class="nx-text-secondary nx-text-sm">(128 评价)</span>
                                    </div>
                                </div>
                                <div class="nx-card__footer">
                                    <button class="nx-btn nx-btn--primary nx-btn--sm" onclick="downloadSkill('weather')">下载</button>
                                    <button class="nx-btn nx-btn--secondary nx-btn--sm" onclick="showDetail('weather')">详情</button>
                                </div>
                            </div>
                            
                            <div class="nx-card">
                                <div class="nx-card__body">
                                    <div class="nx-flex nx-items-center nx-gap-3 nx-mb-3">
                                        <i class="ri-line-chart-line nx-text-2xl nx-text-success"></i>
                                        <div>
                                            <h4 class="nx-font-semibold">股票分析</h4>
                                            <span class="nx-badge nx-badge--primary">v1.0.0</span>
                                        </div>
                                    </div>
                                    <p class="nx-text-secondary nx-text-sm nx-mb-4">基于第三方API的股票查询技能，支持实时价格和历史数据分析。</p>
                                    <div class="nx-flex nx-items-center nx-gap-2 nx-mb-4">
                                        <span class="nx-badge nx-badge--secondary">金融</span>
                                        <span class="nx-badge nx-badge--secondary">数据分析</span>
                                    </div>
                                    <div class="nx-flex nx-items-center nx-gap-2">
                                        <span class="nx-text-warning"><i class="ri-star-fill"></i> 4.6</span>
                                        <span class="nx-text-secondary nx-text-sm">(96 评价)</span>
                                    </div>
                                </div>
                                <div class="nx-card__footer">
                                    <button class="nx-btn nx-btn--primary nx-btn--sm" onclick="downloadSkill('stock')">下载</button>
                                    <button class="nx-btn nx-btn--secondary nx-btn--sm" onclick="showDetail('stock')">详情</button>
                                </div>
                            </div>
                            
                            <div class="nx-card">
                                <div class="nx-card__body">
                                    <div class="nx-flex nx-items-center nx-gap-3 nx-mb-3">
                                        <i class="ri-file-text-line nx-text-2xl nx-text-warning"></i>
                                        <div>
                                            <h4 class="nx-font-semibold">文档处理</h4>
                                            <span class="nx-badge nx-badge--primary">v2.1.0</span>
                                        </div>
                                    </div>
                                    <p class="nx-text-secondary nx-text-sm nx-mb-4">支持多种文档格式转换、内容提取和批量处理功能。</p>
                                    <div class="nx-flex nx-items-center nx-gap-2 nx-mb-4">
                                        <span class="nx-badge nx-badge--secondary">文档</span>
                                        <span class="nx-badge nx-badge--secondary">批量处理</span>
                                    </div>
                                    <div class="nx-flex nx-items-center nx-gap-2">
                                        <span class="nx-text-warning"><i class="ri-star-fill"></i> 4.9</span>
                                        <span class="nx-text-secondary nx-text-sm">(256 评价)</span>
                                    </div>
                                </div>
                                <div class="nx-card__footer">
                                    <button class="nx-btn nx-btn--primary nx-btn--sm" onclick="downloadSkill('document')">下载</button>
                                    <button class="nx-btn nx-btn--secondary nx-btn--sm" onclick="showDetail('document')">详情</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="/skillcenter/console/js/theme-manager.js"></script>
    <script src="/skillcenter/console/js/nexus-menu.js"></script>
    <script src="/skillcenter/console/js/page-init.js" data-auto-init></script>
    <script>
        window.onPageInit = function() {
            console.log('技能市场页面初始化完成');
            initTabs();
        };
        
        function initTabs() {
            document.querySelectorAll('.nx-tabs__tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.nx-tabs__tab').forEach(t => t.classList.remove('nx-tabs__tab--active'));
                    this.classList.add('nx-tabs__tab--active');
                    loadTabContent(this.dataset.tab);
                });
            });
        }
        
        function loadTabContent(tabId) {
            console.log('加载标签页:', tabId);
        }
        
        function searchSkills() {
            const keyword = document.getElementById('search-keyword').value;
            console.log('搜索技能:', keyword);
        }
        
        function resetSearch() {
            document.getElementById('search-keyword').value = '';
        }
        
        function downloadSkill(skillId) {
            console.log('下载技能:', skillId);
            alert('技能下载成功！');
        }
        
        function showDetail(skillId) {
            console.log('查看详情:', skillId);
            alert('技能详情: ' + skillId);
        }
    </script>
</body>
</html>
