<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理中心 - 市场管理</title>
    <link rel="stylesheet" href="/skillcenter/console/css/app.css">
    <link href="/skillcenter/console/css/remixicon/remixicon.css" rel="stylesheet">
    <script src="/skillcenter/console/js/menu.js"></script>
    <script src="/skillcenter/console/js/utils.js"></script>
</head>
<body>
    <div class="container">
        <aside class="sidebar" id="sidebar">
            <!-- 菜单将通过menu.js动态加载 -->
        </aside>
        <main class="main-content" id="main-content">
            <header class="header">
                <h1>市场管理</h1>
                <div class="user-info">
                    <span class="user-name">管理员</span>
                    <i class="ri-user-line"></i>
                </div>
            </header>

            <!-- 筛选查询区域 -->
            <div class="filter-section">
                <div class="filter-form">
                    <div class="filter-row">
                        <div class="filter-item">
                            <label for="filterCategory">技能分类</label>
                            <select id="filterCategory" class="form-control">
                                <option value="">全部分类</option>
                                <option value="text-processing">文本处理</option>
                                <option value="development">开发工具</option>
                                <option value="deployment">部署工具</option>
                                <option value="media">媒体处理</option>
                                <option value="storage">存储管理</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label for="filterStatus">技能状态</label>
                            <select id="filterStatus" class="form-control">
                                <option value="">全部状态</option>
                                <option value="active">活跃</option>
                                <option value="pending">待审核</option>
                                <option value="inactive">停用</option>
                            </select>
                        </div>
                        <div class="filter-item filter-item-large">
                            <label for="filterKeyword">关键词</label>
                            <input type="text" id="filterKeyword" placeholder="搜索技能名称或ID" class="form-control">
                        </div>
                    </div>
                </div>
                <div class="filter-actions">
                    <button class="btn btn-primary" id="btnSearchSkills" type="button" onclick="console.log('查询按钮被点击'); if(typeof searchMarketSkills === 'function') searchMarketSkills(); else console.error('searchMarketSkills函数未定义');">
                        <i class="ri-search-line"></i> 查询
                    </button>
                    <button class="btn btn-secondary" id="btnResetFilters" type="button" onclick="console.log('重置按钮被点击'); if(typeof resetFilters === 'function') resetFilters(); else console.error('resetFilters函数未定义');">
                        <i class="ri-refresh-line"></i> 重置
                    </button>
                    <button class="btn btn-success" onclick="openAddMarketSkillModal()">
                        <i class="ri-add-line"></i> 添加技能
                    </button>
                </div>
            </div>

            <!-- 市场技能列表 -->
            <div class="skills-table">
                <table>
                    <thead>
                        <tr>
                            <th>技能ID</th>
                            <th>技能名称</th>
                            <th>分类</th>
                            <th>状态</th>
                            <th>下载量</th>
                            <th>评分</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="skillTableBody">
                        <!-- 技能数据将通过JavaScript动态填充 -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- 添加/编辑市场技能模态框 -->
    <div id="skillModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加市场技能</h3>
                <span class="close" onclick="closeSkillModal()">&times;</span>
            </div>
            <form id="skillForm">
                <input type="hidden" id="skillId">
                <div class="form-group">
                    <label for="skillName">技能名称</label>
                    <input type="text" class="form-control" id="skillName" required>
                </div>
                <div class="form-group">
                    <label for="skillDescription">技能描述</label>
                    <textarea class="form-control" id="skillDescription" required></textarea>
                </div>
                <div class="form-group">
                    <label for="skillCategory">技能分类</label>
                    <select class="form-control" id="skillCategory" required>
                        <option value="text-processing">文本处理</option>
                        <option value="development">开发工具</option>
                        <option value="deployment">部署工具</option>
                        <option value="media">媒体处理</option>
                        <option value="storage">存储管理</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="skillStatus">技能状态</label>
                    <select class="form-control" id="skillStatus" required>
                        <option value="active">活跃</option>
                        <option value="pending">待审核</option>
                        <option value="inactive">停用</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="skillVersion">技能版本</label>
                    <input type="text" class="form-control" id="skillVersion" required>
                </div>
                <div class="form-group">
                    <label for="skillAuthor">技能作者</label>
                    <input type="text" class="form-control" id="skillAuthor" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeSkillModal()">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveMarketSkill()">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/skillcenter/console/js/market-management.js"></script>
</body>
</html>
