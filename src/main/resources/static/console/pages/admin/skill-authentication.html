<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理中心 - 技能认证</title>
    <link rel="stylesheet" href="/skillcenter/console/css/app.css">
    <link href="/skillcenter/console/css/remixicon/remixicon.css" rel="stylesheet">
    <script src="/skillcenter/console/js/menu.js"></script>
    <script src="/skillcenter/console/js/utils.js"></script>

</head>
<body>
    <aside class="skillcenter-sidebar" id="sidebar">
        <!-- 菜单将通过menu.js动态加载 -->
    </aside>
    <main class="skillcenter-content-with-sidebar" id="main-content">
            <header class="skillcenter-header">
                <h1>技能认证管理</h1>
                <div class="skillcenter-user-info">
                    <span class="skillcenter-user-name">管理员</span>
                    <i class="ri-user-line"></i>
                </div>
            </header>
            <div class="skillcenter-skill-authentication-container">
                <div class="skillcenter-page-header">
                    <button class="skillcenter-btn skillcenter-btn-primary" onclick="openIssueCertificateModal()">
                        <i class="ri-certificate-line"></i> 签发认证
                    </button>
                </div>
        
        <!-- 搜索和筛选 -->
        <div class="skillcenter-filter-section">
            <div class="skillcenter-filter-row">
                <div class="skillcenter-filter-item">
                    <label for="statusFilter">认证状态</label>
                    <select id="statusFilter" class="skillcenter-form-control">
                        <option value="">全部状态</option>
                        <option value="pending">待审核</option>
                        <option value="approved">已批准</option>
                        <option value="rejected">已拒绝</option>
                    </select>
                </div>
                <div class="skillcenter-filter-item skillcenter-filter-item-large">
                    <label for="skillSearch">关键词</label>
                    <input type="text" placeholder="搜索技能名称或ID" id="skillSearch" class="skillcenter-form-control">
                </div>
            </div>
            <div class="skillcenter-filter-actions">
                <button class="skillcenter-btn skillcenter-btn-primary" id="btnSearchAuth" type="button" onclick="console.log('查询按钮被点击'); if(typeof searchAuth === 'function') searchAuth(); else console.error('searchAuth函数未定义');">
                    <i class="ri-search-line"></i> 查询
                </button>
                <button class="skillcenter-btn skillcenter-btn-secondary" id="btnResetFilters" type="button" onclick="console.log('重置按钮被点击'); if(typeof resetFilters === 'function') resetFilters(); else console.error('resetFilters函数未定义');">
                    <i class="ri-refresh-line"></i> 重置
                </button>
            </div>
        </div>
        
        <!-- 认证列表 -->
        <div class="skillcenter-authentication-list">
            <table>
                <thead>
                    <tr>
                        <th>认证ID</th>
                        <th>技能名称</th>
                        <th>技能ID</th>
                        <th>申请人</th>
                        <th>申请时间</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="authTableBody">
                    <!-- 认证数据将通过JavaScript动态填充 -->
                </tbody>
            </table>
        </div>
            </div>
            
            <!-- 签发认证模态框 -->
            <div id="certificateModal" class="skillcenter-modal">
                <div class="skillcenter-modal-content">
                    <div class="skillcenter-modal-header">
                        <h2>签发技能认证</h2>
                        <button class="skillcenter-close-btn" onclick="closeCertificateModal()">&times;</button>
                    </div>
                    <div class="skillcenter-modal-body">
                        <form id="certificateForm">
                            <div class="skillcenter-form-group">
                                <label for="skillSelect">选择技能</label>
                                <select id="skillSelect" required class="skillcenter-form-control">
                                    <option value="">请选择技能</option>
                                    <!-- 技能选项将通过JavaScript动态填充 -->
                                </select>
                            </div>
                            <div class="skillcenter-form-group">
                                <label for="certificateType">认证类型</label>
                                <select id="certificateType" required class="skillcenter-form-control">
                                    <option value="standard">标准认证</option>
                                    <option value="premium">高级认证</option>
                                    <option value="enterprise">企业认证</option>
                                </select>
                            </div>
                            <div class="skillcenter-form-group">
                                <label for="certificateDescription">认证描述</label>
                                <textarea id="certificateDescription" required class="skillcenter-form-control"></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="skillcenter-modal-footer">
                        <button type="button" class="skillcenter-btn skillcenter-btn-secondary" onclick="closeCertificateModal()">取消</button>
                        <button type="button" class="skillcenter-btn skillcenter-btn-primary" onclick="submitCertificateForm()">签发认证</button>
                    </div>
                </div>
            </div>
            
            <!-- 审核认证模态框 -->
            <div id="reviewModal" class="skillcenter-modal">
                <div class="skillcenter-modal-content">
                    <div class="skillcenter-modal-header">
                        <h2>审核技能认证</h2>
                        <button class="skillcenter-close-btn" onclick="closeReviewModal()">&times;</button>
                    </div>
                    <div class="skillcenter-modal-body">
                        <form id="reviewForm">
                            <input type="hidden" id="authId">
                            <div class="skillcenter-skill-details" id="skillDetails">
                                <!-- 技能详情将通过JavaScript动态填充 -->
                            </div>
                            <div class="skillcenter-form-group">
                                <label for="reviewStatus">审核结果</label>
                                <select id="reviewStatus" required class="skillcenter-form-control">
                                    <option value="approved">批准</option>
                                    <option value="rejected">拒绝</option>
                                </select>
                            </div>
                            <div class="skillcenter-form-group">
                                <label for="reviewComments">审核意见</label>
                                <textarea id="reviewComments" required class="skillcenter-form-control"></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="skillcenter-modal-footer">
                        <button type="button" class="skillcenter-btn skillcenter-btn-secondary" onclick="closeReviewModal()">取消</button>
                        <button type="button" class="skillcenter-btn skillcenter-btn-primary" onclick="submitReviewForm()">提交审核</button>
                    </div>
                </div>
            </div>
    
    <script src="/skillcenter/console/js/skill-authentication.js"></script>
</main>
</body>
</html>
