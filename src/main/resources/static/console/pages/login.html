<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillCenter - 登录</title>
    <link rel="stylesheet" href="/skillcenter/console/css/pages/login.css">
    <script src="/skillcenter/console/js/pages/login.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">SkillCenter</div>
            <div class="login-subtitle">技能管理和执行平台</div>
        </div>
        
        <div class="error-message" id="error-message">
            用户名或密码错误，请重试
        </div>
        
        <div class="success-message" id="success-message">
            登录成功，正在跳转...
        </div>
        
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" required>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码" required>
            </div>
            
            <div class="form-options">
                <div class="remember-me">
                    <input type="checkbox" id="remember-me">
                    <label for="remember-me">记住我</label>
                </div>
                <a href="#" class="forgot-password">忘记密码？</a>
            </div>
            
            <button type="submit" class="btn btn-primary">登录</button>
            <button type="button" class="btn btn-secondary" onclick="goToInstall()">初始化安装</button>
        </form>
        
        <div class="login-footer">
            &copy; 2026 SkillCenter. 保留所有权利。
        </div>
    </div>
</body>
</html>
